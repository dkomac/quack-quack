[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quacky"
version = "0.1.0"
description = "A duck that quacks in your terminal"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
quack = "quack_quack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["quack_quack"]
